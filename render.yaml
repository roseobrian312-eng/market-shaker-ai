services:
  - type: web
    name: market-shaker-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
# Configure DASHBOARD_PASSWORD, DERIV_APP_ID (PAT app), DERIV_PAT privately in Render.
# Do NOT put credentials in this file or GitHub.
